<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Digitales Lernen</title>
<meta name="description" content="Interaktive Lernmaterialien für Mathematik und Naturwissenschaften">
<style>
  :root {
    --bg: #f5f6f8;
    --surface: #ffffff;
    --text: #1b2130;
    --muted: #5a6374;
    --line: #e2e5ea;
    --m11: #2563eb;
    --nw12: #0b8f61;
    --m13: #8b3fd9;
    --radius: 14px;
    --shadow: 0 1px 2px rgba(20, 30, 50, .06), 0 4px 14px rgba(20, 30, 50, .05);
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #10131a;
      --surface: #191e27;
      --text: #e7eaf0;
      --muted: #9aa3b3;
      --line: #2a303c;
      --m11: #6c9cff;
      --nw12: #3cd19b;
      --m13: #c08bff;
      --shadow: 0 1px 2px rgba(0, 0, 0, .3);
    }
  }
  * { box-sizing: border-box; }
  html { -webkit-text-size-adjust: 100%; }
  body {
    margin: 0;
    background: var(--bg);
    color: var(--text);
    font-family: system-ui, -apple-system, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
    line-height: 1.5;
  }
  .wrap { max-width: 980px; margin: 0 auto; padding: 0 16px; }

  /* Kopf */
  header { padding: 40px 0 8px; }
  .kicker {
    font-size: .8rem; font-weight: 600; letter-spacing: .08em; text-transform: uppercase;
    color: var(--muted); margin: 0 0 6px;
  }
  h1 { font-size: clamp(1.8rem, 5vw, 2.5rem); line-height: 1.15; margin: 0 0 8px; letter-spacing: -.02em; }
  .intro { color: var(--muted); margin: 0; max-width: 60ch; }

  /* Suche und Filter */
  .werkzeuge {
    position: sticky; top: 0; z-index: 5;
    background: var(--bg);
    padding: 16px 0 12px;
    border-bottom: 1px solid var(--line);
  }
  .suche { position: relative; margin-bottom: 12px; }
  .suche svg { position: absolute; left: 14px; top: 50%; transform: translateY(-50%); color: var(--muted); }
  .suche input {
    width: 100%; font: inherit; font-size: 1rem; color: var(--text);
    background: var(--surface); border: 1px solid var(--line); border-radius: 999px;
    padding: 11px 16px 11px 42px; outline: none;
  }
  .suche input:focus { border-color: var(--m11); box-shadow: 0 0 0 3px color-mix(in srgb, var(--m11) 20%, transparent); }
  .chips { display: flex; gap: 8px; flex-wrap: wrap; }
  .chip {
    font: inherit; font-size: .92rem; cursor: pointer;
    border: 1px solid var(--line); background: var(--surface); color: var(--text);
    border-radius: 999px; padding: 6px 14px; display: inline-flex; align-items: center; gap: 8px;
  }
  .chip .punkt { width: 9px; height: 9px; border-radius: 50%; background: var(--akzent, var(--muted)); }
  .chip .anzahl { color: var(--muted); font-size: .82rem; }
  .chip[aria-pressed="true"] { background: var(--text); color: var(--bg); border-color: var(--text); }
  .chip[aria-pressed="true"] .anzahl { color: inherit; opacity: .7; }
  .chip:focus-visible, .karte:focus-visible { outline: 3px solid var(--m11); outline-offset: 2px; }

  /* Kurse */
  main.wrap { padding: 8px 16px 40px; }
  .kurs { margin-top: 32px; }
  .kurs-kopf { display: flex; align-items: center; gap: 12px; margin-bottom: 4px; }
  .kurs-symbol {
    width: 40px; height: 40px; border-radius: 11px; flex: none;
    display: grid; place-items: center; font-weight: 700; font-size: .95rem;
    color: #fff; background: var(--akzent);
  }
  .kurs h2 { font-size: 1.3rem; margin: 0; line-height: 1.2; }
  .kurs-info { color: var(--muted); font-size: .88rem; margin: 0; }
  .kurs h3 {
    font-size: .8rem; font-weight: 600; letter-spacing: .06em; text-transform: uppercase;
    color: var(--muted); margin: 20px 0 10px;
  }

  .raster { display: grid; grid-template-columns: repeat(auto-fill, minmax(270px, 1fr)); gap: 12px; }
  .karte {
    display: flex; flex-direction: column; gap: 6px;
    background: var(--surface); border: 1px solid var(--line); border-radius: var(--radius);
    border-top: 4px solid var(--akzent);
    padding: 14px 16px 16px; text-decoration: none; color: inherit; box-shadow: var(--shadow);
    transition: transform .15s ease, box-shadow .15s ease;
  }
  .karte:hover { transform: translateY(-2px); box-shadow: 0 6px 22px rgba(20, 30, 50, .12); }
  .karte-titel { font-weight: 650; font-size: 1.05rem; line-height: 1.3; }
  .karte-text { color: var(--muted); font-size: .92rem; margin: 0; flex: 1; }
  .karte-fuss { display: flex; align-items: center; justify-content: space-between; gap: 8px; margin-top: 6px; }
  .marken { display: flex; gap: 6px; flex-wrap: wrap; }
  .marke {
    font-size: .76rem; font-weight: 600; padding: 2px 9px; border-radius: 999px;
    background: color-mix(in srgb, var(--akzent) 13%, transparent); color: var(--akzent);
  }
  .marke.neu { background: #f59e0b; color: #1b1300; }
  .marke.spiel { background: #e11d74; color: #fff; }
  .oeffnen { color: var(--akzent); font-size: .9rem; font-weight: 600; white-space: nowrap; }

  .leer {
    text-align: center; color: var(--muted); padding: 48px 16px;
    border: 1px dashed var(--line); border-radius: var(--radius); margin-top: 32px;
  }

  footer { border-top: 1px solid var(--line); padding: 20px 0 40px; color: var(--muted); font-size: .88rem; }
  footer p { margin: 4px 0; }

  @media (max-width: 520px) {
    header { padding-top: 28px; }
    .raster { grid-template-columns: 1fr; }
  }
  @media (prefers-reduced-motion: reduce) { .karte { transition: none; } .karte:hover { transform: none; } }
</style>
</head>
<body>

<header class="wrap">
  <p class="kicker">Lernmaterial</p>
  <h1>Digitales Lernen</h1>
  <p class="intro">Interaktive Materialien zum Üben, Wiederholen und selbstständigen Lernen. Wähle deine Klasse oder suche nach einem Thema.</p>
</header>

<div class="werkzeuge">
  <div class="wrap">
    <div class="suche">
      <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><circle cx="11" cy="11" r="7"/><path d="m20 20-3.5-3.5"/></svg>
      <input id="suche" type="search" placeholder="Thema suchen, z. B. Parabel oder Geschwindigkeit" aria-label="Materialien durchsuchen" autocomplete="off">
    </div>
    <div class="chips" id="chips" role="group" aria-label="Nach Klasse filtern"></div>
  </div>
</div>

<main class="wrap" id="inhalt" aria-live="polite"></main>

<footer class="wrap">
  <p>Tipp: Speichere diese Seite als Lesezeichen – hier findest du immer alle aktuellen Materialien.</p>
  <p id="stand"></p>
</footer>

<script>
/* ==========================================================================
   MATERIALIEN PFLEGEN
   --------------------------------------------------------------------------
   Neues Material hinzufügen: im passenden Kurs unter "materialien" eine Zeile
   ergänzen (am einfachsten eine vorhandene Zeile kopieren und anpassen).

     datei : Dateiname genau wie auf GitHub (Groß-/Kleinschreibung beachten!)
     titel : Anzeigename
     lb    : Nummer des Lernbereichs
     art   : "Zusammenfassung", "Übung", "Selbstlernen" oder "Spiel"
     text  : kurze Beschreibung (ein Satz)
     neu   : true  -> zeigt die Marke "Neu" (optional, später wieder löschen)

   Neuer Kurs: einen ganzen Block { ... } kopieren, "id", "ordner", "fach",
   "klasse", "kurz" und "farbe" anpassen. Farben: "--m11", "--nw12", "--m13"
   (weitere Farben oben im <style>-Bereich unter :root ergänzen).
   ========================================================================== */

const STAND = "November 2026";

const KURSE = [
  {
    id: "m11", ordner: "mathe_f11nt", fach: "Mathematik", klasse: "11. Klasse", kurz: "M11", farbe: "--m11",
    lernbereiche: { 1: "" },   // optional: Namen der Lernbereiche, z. B. { 1: "Funktionen" }
    materialien: [
      { datei: "LB1_Lineare_Funktionen_Zusammenfassung.html", titel: "Lineare Funktionen", lb: 1, art: "Zusammenfassung",
        text: "Funktionsbegriff, Funktionsterm ablesen, Nullstellen, parallele und senkrechte Geraden, Anwendungen." },
      { datei: "LB1_Quadratische_Funktionen_Grundlagen_SOL.html", titel: "Quadratische Funktionen – Grundlagen", lb: 1, art: "Selbstlernen",
        text: "Parabeln, Scheitelpunktform und Verschiebungen selbstständig erarbeiten." },
      { datei: "LB1_jeopardy_spiel_parabeln.html", titel: "Jeopardy: Parabeln", lb: 1, art: "Spiel", neu: false,
        text: "Quizspiel zu Parabeln und quadratischen Funktionen – Kategorien wählen und Punkte sammeln." }
    ]
  },
  {
    id: "m13", ordner: "mathe_13nt", fach: "Mathematik", klasse: "13. Klasse", kurz: "M13", farbe: "--m13",
    lernbereiche: { 1: "" },
    materialien: [
      { datei: "LB1_Zusammenfassung_gebrochen_rationale_fkt.html", titel: "Gebrochen-rationale Funktionen", lb: 1, art: "Zusammenfassung",
        text: "Das Wichtigste zu gebrochen-rationalen Funktionen auf einen Blick." },
      { datei: "LB1_Zuordnung_gebrochen_rationale_Funktionen.html", titel: "Terme und Graphen zuordnen", lb: 1, art: "Übung",
        text: "Funktionsterme den passenden Graphen zuordnen – mit direktem Feedback." }
    ]
  },
  {
    id: "nw12", ordner: "nawi_12nt", fach: "Naturwissenschaften", klasse: "12. Klasse", kurz: "NW", farbe: "--nw12",
    lernbereiche: { 1: "" },
    materialien: [
      { datei: "LB1_Konstante_Geschwindigkeit.html", titel: "Konstante Geschwindigkeit", lb: 1, art: "Zusammenfassung",
        text: "Gleichförmige Bewegung, Weg-Zeit-Diagramme und Berechnungen zur Geschwindigkeit." }
    ]
  }
];

/* ======================= ab hier nichts ändern ======================= */

const chipsEl = document.getElementById("chips");
const inhaltEl = document.getElementById("inhalt");
const sucheEl = document.getElementById("suche");
document.getElementById("stand").textContent = "Stand: " + STAND;

const esc = s => String(s ?? "").replace(/[&<>"']/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
const norm = s => String(s ?? "").toLowerCase().normalize("NFD").replace(/[\u0300-\u036f]/g, "");

let aktiv = "alle";
let suche = "";

function passt(m, k) {
  if (!suche) return true;
  const heu = norm([m.titel, m.text, m.art, k.fach, k.klasse, k.kurz].join(" "));
  return norm(suche).split(/\s+/).filter(Boolean).every(w => heu.includes(w));
}

function chips() {
  const gesamt = KURSE.reduce((n, k) => n + k.materialien.length, 0);
  const liste = [{ id: "alle", name: "Alle", anzahl: gesamt }]
    .concat(KURSE.map(k => ({ id: k.id, name: k.fach === "Mathematik" ? "Mathe " + k.klasse.replace(". Klasse", "") : k.fach + " " + k.klasse.replace(". Klasse", ""), anzahl: k.materialien.length, farbe: k.farbe })));
  chipsEl.innerHTML = liste.map(c =>
    `<button class="chip" type="button" data-id="${esc(c.id)}" aria-pressed="${c.id === aktiv}"${c.farbe ? ` style="--akzent:var(${c.farbe})"` : ""}>` +
    (c.farbe ? `<span class="punkt"></span>` : "") +
    `${esc(c.name)} <span class="anzahl">${c.anzahl}</span></button>`).join("");
}

function karte(m, k) {
  const href = encodeURI(k.ordner + "/" + m.datei);
  return `<a class="karte" href="${href}">
      <span class="karte-titel">${esc(m.titel)}</span>
      <p class="karte-text">${esc(m.text)}</p>
      <span class="karte-fuss">
        <span class="marken">${m.neu ? `<span class="marke neu">Neu</span>` : ""}<span class="marke${m.art === "Spiel" ? " spiel" : ""}">${m.art === "Spiel" ? "🎲 " : ""}${esc(m.art)}</span></span>
        <span class="oeffnen" aria-hidden="true">Öffnen →</span>
      </span>
    </a>`;
}

function render() {
  let html = "", treffer = 0;
  for (const k of KURSE) {
    if (aktiv !== "alle" && aktiv !== k.id) continue;
    const mats = k.materialien.filter(m => passt(m, k));
    if (!mats.length) continue;
    treffer += mats.length;
    const gruppen = {};
    mats.forEach(m => (gruppen[m.lb] = gruppen[m.lb] || []).push(m));
    html += `<section class="kurs" style="--akzent:var(${k.farbe})" aria-labelledby="h-${esc(k.id)}">
      <div class="kurs-kopf">
        <div class="kurs-symbol" aria-hidden="true">${esc(k.kurz)}</div>
        <div><h2 id="h-${esc(k.id)}">${esc(k.fach)} · ${esc(k.klasse)}</h2>
        <p class="kurs-info">${mats.length} ${mats.length === 1 ? "Material" : "Materialien"}</p></div>
      </div>`;
    for (const lb of Object.keys(gruppen).sort((a, b) => a - b)) {
      const name = (k.lernbereiche && k.lernbereiche[lb]) ? " · " + k.lernbereiche[lb] : "";
      html += `<h3>Lernbereich ${esc(lb)}${esc(name)}</h3><div class="raster">${gruppen[lb].map(m => karte(m, k)).join("")}</div>`;
    }
    html += `</section>`;
  }
  inhaltEl.innerHTML = treffer ? html : `<p class="leer">Keine Materialien gefunden. Versuche einen anderen Suchbegriff oder wähle „Alle“.</p>`;
}

function setzeFilter(id, hashSetzen) {
  aktiv = KURSE.some(k => k.id === id) ? id : "alle";
  chipsEl.querySelectorAll(".chip").forEach(b => b.setAttribute("aria-pressed", b.dataset.id === aktiv));
  if (hashSetzen) history.replaceState(null, "", aktiv === "alle" ? location.pathname : "#" + aktiv);
  render();
}

chipsEl.addEventListener("click", e => {
  const b = e.target.closest(".chip");
  if (b) setzeFilter(b.dataset.id, true);
});
sucheEl.addEventListener("input", () => { suche = sucheEl.value.trim(); render(); });
window.addEventListener("hashchange", () => setzeFilter(location.hash.slice(1), false));

chips();
setzeFilter(location.hash.slice(1), false);
</script>
</body>
</html>
